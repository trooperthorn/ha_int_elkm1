blueprint:
  name: "ELK-M1: Auto-setup Alarmo on Startup"
  description: |
    Automatically triggers Alarmo auto-discovery for ELK-M1 zones when Home Assistant 
    starts up and the security panel becomes available, with optional sidebar pinning.
  domain: automation
  source_url: https://github.com/trooperthorn/ha_int_elkm1/blob/main/blueprints/automation/alarmo_setup.yaml

  input:
    alarm_panel:
      name: ELK-M1 Alarm Panel
      description: The ELK-M1 alarm control panel entity used to check system availability.
      selector:
        entity:
          domain: alarm_control_panel
    
    stabilization_delay:
      name: Startup Stabilization Delay (seconds)
      description: Time to wait after startup before executing the auto-setup routine.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 1

    enable_sidebar_order:
      name: Pin Alarmo to Sidebar
      description: Automatically ensure Alarmo is prioritized in the sidebar navigation.
      default: true
      selector:
        boolean: {}

trigger:
  - platform: homeassistant
    event: start

condition:
  - condition: not
    conditions:
      - condition: state
        entity_id: !input alarm_panel
        state: "unavailable"

variables:
  sidebar_enabled: !input enable_sidebar_order

action:
  - delay:
      seconds: !input stabilization_delay
  
  - action: elkm1.alarmo_auto_setup
    data: {}
  
  - if:
      - condition: template
        value_template: "{{ sidebar_enabled }}"
    then:
      - action: frontend.set_sidebar_order
        data:
          sidebar_order:
            - alarmo
