speak_word:
  name: Speak word
  description: Speaks a word. See list of words in Elk-M1 ASCII Protocol documentation.
  fields:
    number:
      name: Word number
      description: Word number to speak.
      required: true
      selector:
        number:
          min: 1
          max: 473
    prefix:
      name: Prefix
      description: Prefix to identify panel when multiple panels configured.
      example: gatehouse
      default: ""
      selector:
        text:

sensor_counter_refresh:
  name: Sensor counter refresh
  description: Refreshes the value of a counter from the panel.
  target:
    entity:
      integration: elkm1
      domain: number

sensor_counter_set:
  name: Sensor counter set
  description: Sets the value of a counter on the panel.
  target:
    entity:
      integration: elkm1
      domain: number
  fields:
    value:
      name: Value
      description: Value to set the counter to.
      required: true
      selector:
        number:
          min: 0
          max: 65535

sensor_zone_bypass:
  name: Sensor zone bypass
  description: Bypasses zone. Target the zone's own sensor entity (temperature/analog
    zones) or binary_sensor entity (every other zone type) - not a switch, since
    bypassing a zone always requires this code, with no way to silently toggle it
    from a dashboard.
  target:
    entity:
      integration: elkm1
      domain:
        - sensor
        - binary_sensor
  fields:
    code:
      name: Code
      description: Alarm code to authorize the bypass of the zone.
      required: true
      example: 4242
      selector:
        text:

sensor_zone_trigger:
  name: Sensor zone trigger
  description: Triggers zone.
  target:
    entity:
      integration: elkm1
      domain: sensor

switch_output_turn_on_for:
  name: Switch output turn on for
  description: Turns on an output for a specified length of time.
  target:
    entity:
      integration: elkm1
      domain: switch
  fields:
    duration:
      name: Duration
      description: Length of time to turn the output on for.
      required: true
      example: 42
      selector:
        duration:
