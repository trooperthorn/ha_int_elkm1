alarm_bypass:
  name: Alarm bypass
  description: Bypasses all zones for the area.
  target:
    entity:
      integration: elkm1
      domain: alarm_control_panel
  fields:
    code:
      name: Code
      description: Alarm code to authorize the bypass of the alarm control panel.
      required: true
      example: 4242
      selector:
        text:

alarm_clear_bypass:
  name: Alarm clear bypass
  description: Removes bypass on all zones for the area.
  target:
    entity:
      integration: elkm1
      domain: alarm_control_panel
  fields:
    code:
      name: Code
      description: Alarm code to authorize the bypass clear of the alarm control panel.
      required: true
      example: 4242
      selector:
        text:

alarm_arm_home_instant:
  name: Alarm arm home instant
  description: Arms the Elk-M1 in home instant mode.
  target:
    entity:
      integration: elkm1
      domain: alarm_control_panel
  fields:
    code:
      name: Code
      description: Alarm code to arm the alarm control panel.
      required: true
      example: 1234
      selector:
        text:

alarm_arm_night_instant:
  name: Alarm arm night instant
  description: Arms the Elk-M1 in night instant mode.
  target:
    entity:
      integration: elkm1
      domain: alarm_control_panel
  fields:
    code:
      name: Code
      description: Alarm code to arm the alarm control panel.
      required: true
      example: 1234
      selector:
        text:

alarm_force_arm_away:
  name: Alarm force arm away
  description: >-
    Force arm-away, overriding any violated zone that allows it. A zone with
    bypass disabled in its own zone options (e.g. a main entry/exit door, by
    installer design) is excluded from force-arm the same way it is excluded
    from a normal bypass, and stays violated.
  target:
    entity:
      integration: elkm1
      domain: alarm_control_panel
  fields:
    code:
      name: Code
      description: Alarm code to authorize the force arm.
      required: true
      example: 1234
      selector:
        text:

alarm_force_arm_stay:
  name: Alarm force arm stay
  description: >-
    Force arm-stay, overriding any violated zone that allows it. Same
    bypass-disabled exclusion as alarm_force_arm_away.
  target:
    entity:
      integration: elkm1
      domain: alarm_control_panel
  fields:
    code:
      name: Code
      description: Alarm code to authorize the force arm.
      required: true
      example: 1234
      selector:
        text:

display_message:
  name: Display message
  description: Displays a message on all of the Elk-M1 keypads for an area.
  fields:
    prefix:
      name: Prefix
      description: Prefix to identify panel when multiple panels configured.
      example: gatehouse
      selector:
        text:
    area:
      name: Area
      description: Area number (1-8) whose keypads should display the message.
      default: 1
      selector:
        number:
          min: 1
          max: 8
    clear:
      name: Clear
      description: 0=clear message, 1=clear message with * key, 2=Display until timeout.
      default: 0
      selector:
        number:
          min: 0
          max: 2
    beep:
      name: Beep
      description: Whether to beep when the message is displayed.
      default: false
      selector:
        boolean:
    timeout:
      name: Timeout
      description: Time to display message, 0=forever, max 65535.
      default: 0
      selector:
        number:
          min: 0
          max: 65535
    line1:
      name: Line 1
      description: Up to 16 characters of text (truncated if too long).
      example: The answer to life.
      default: ""
      selector:
        text:
    line2:
      name: Line 2
      description: Up to 16 characters of text (truncated if too long).
      example: the universe, and everything.
      default: ""
      selector:
        text:

set_time:
  name: Set time
  description: Sets the time for the panel.
  fields:
    prefix:
      name: Prefix
      description: Prefix for the panel.
      example: gatehouse
      selector:
        text:

get_security_summary:
  name: Get Security Summary
  description: Returns live security data (faulted zones, ready to arm status) to an automation or script.
  fields:
    prefix:
      name: Prefix
      description: Prefix for the panel.
      selector:
        text:

programming_session_start:
  name: Programming session start
  description: Announce that a programming tool (the Elk Programmer app) is about to open a remote programming session, so the session is attributed instead of reported as unknown.
  fields:
    source:
      name: Source
      description: The tool announcing the session, for example the app slug.
      required: true
      example: elk_programmer
      selector:
        text:
    user:
      name: User
      description: The Home Assistant user id operating the tool.
      selector:
        text:
    purpose:
      name: Purpose
      description: receive, send, or verify.
      example: receive
      selector:
        text:

programming_session_end:
  name: Programming session end
  description: Report that the announced programming session has closed.
  fields:
    source:
      name: Source
      description: The tool that announced the session.
      required: true
      selector:
        text:
    user:
      name: User
      description: The Home Assistant user id operating the tool.
      selector:
        text:

alarmo_auto_setup:
  name: "Alarmo Auto-Setup"
  description: "Auto-configure Alarmo with discovered ELK-M1 zones."

