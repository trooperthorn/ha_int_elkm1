rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: |
      local_push primary (elk.add_handler per message type); update_interval
      is a configurable fallback poll rate (options flow) for panels with
      broadcast categories disabled in Global Programming.
  brands:
    status: done
    comment: |
      custom_components/elkm1/brand/icon.png (256x256) and logo.png
      (512x256) ship locally, served through the Brands Proxy API (HA
      2026.3.0+) - verified 2026-09-05 against home-assistant/brands' own
      README, which now calls its `custom_integrations/` submission folder
      "Legacy": "Since HA 2026.3.0, custom components can include their
      brand icons directly." Both images meet that repo's own size spec
      (icon 256x256, logo's shortest side <=256px). No PR to the brands
      repo is needed or preferred for a custom integration on a current
      core version.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/test_config_flow.py covers manual network, selected-port serial,
      DHCP/directed discovery, secure auth versus timeout, duplicate identity,
      network/serial reconfigure mismatch behavior, reauth, options, and the
      explicitly supported multi-panel policy. Generic USB discovery is not
      retained because bridge VID/PID metadata is not ELK-product-specific.
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      The elkm1-lib PyPI dependency was removed 2026-09-05 (see
      docs/decisions.md); the ELK-M1 protocol implementation
      (helpers/elk/) is now owned directly by this repository. The only
      remaining runtime dependency is serialx==1.9.0, pinned in
      manifest.json.
  docs-actions:
    status: done
    comment: README's Services section lists every real domain-level and entity-level service, matching services.yaml.
  docs-high-level-description:
    status: done
    comment: |
      README.md rewritten - it previously had duplicate H1/Features/
      Installation/Services sections and a literal "## OLD INFO I WANT TO
      ADD BACK AND VERIFY" draft section left in place.
  docs-installation-instructions:
    status: done
    comment: README's Installation section covers HACS, manual install, and initial setup (discovery vs. manual vs. serial).
  docs-removal-instructions:
    status: done
    comment: README's "Removing the integration" section.
  entity-event-setup:
    status: done
    comment: |
      Entities are CoordinatorEntity-based; push updates are registered
      once per message type at the coordinator (elk.add_handler in
      _register_push_callbacks), not ad hoc per entity, so there's no
      per-entity listener setup/teardown to get wrong.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: config_flow.py's validate_input() opens a real, briefly-lived connection before creating the entry.
  test-before-setup:
    status: done
    comment: |
      coordinator._async_setup() waits for the panel's own "login" event
      (success or failure) before the first refresh is considered
      complete, rather than assuming a raw socket/serial open means the
      panel is actually there and responding.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: |
      alarm_control_panel.py's command methods used to catch and only log
      failures, so a failed arm/disarm/bypass command looked like success
      to HA. Fixed to raise HomeAssistantError via a shared
      _async_run_command() helper. Other write-capable platforms
      (switch/number/light/climate) don't wrap their calls in a swallowing
      try/except, so exceptions already propagated correctly there.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: |
      strings.json's options/reconfigure step descriptions document each
      field directly in the flow UI; README's Setup section points to
      where to find Configure/Reconfigure.
  docs-installation-parameters:
    status: done
    comment: strings.json's user/manual_connection/serial step descriptions document every field required during setup.
  entity-unavailable:
    status: done
    comment: Inherited from CoordinatorEntity, tracking coordinator.last_update_success.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      Verified against homeassistant/helpers/update_coordinator.py:
      async_set_update_error (used by _handle_disconnected) already guards
      its error log with `if self.last_update_success`, so a disconnect
      logs once, not per retry. The matching "recovered" log is built into
      DataUpdateCoordinator._async_refresh for the poll path, but this
      integration is local_push primary and recovers through _on_login
      calling async_set_updated_data directly, which core does not
      instrument the same way - added an explicit one-time info log there,
      guarded the same way, so both directions log exactly once.
  parallel-updates:
    status: done
    comment: |
      PARALLEL_UPDATES = 1 on every platform that writes to the panel's
      single serialized command buffer: alarm_control_panel, switch,
      sensor (zone bypass/trigger services), climate, light, number,
      scene, time. binary_sensor is read-only and left unset.
  reauthentication-flow:
    status: done
    comment: |
      async_step_reauth/async_step_reauth_confirm, triggered by
      ConfigEntryAuthFailed on a real "login" failure from the panel.
      Serial connections (no username/password) abort as
      reauth_unsupported rather than showing an inapplicable form.
  test-coverage:
    status: done
    comment: |
      Measured 2026-09-05: 99% overall line coverage across
      custom_components/elkm1 (4038 statements, 11 missed; 969 tests),
      raised from an earlier 82% baseline. Every platform/entity module
      previously below threshold (device_action.py, util.py, discovery.py,
      transport.py, climate.py, sensor.py, time.py, baud_probe.py,
      coordinator.py, __init__.py, binary_sensor.py, alarm_control_panel.py,
      config_flow.py) is now at 97-100%. The handful of remaining missed
      lines (alarm_control_panel.py:94, services.py:74, one or two lines
      each in discovery.py/baud_probe.py/message.py/transport.py) are
      defensive branches not practically reachable through the public
      surface exercised by tests. Live hardware qualification is tracked
      separately in docs/live_qualification.md.

  # Gold
  devices:
    status: done
    comment: |
      All entities attach to one panel-wide device via
      create_elk_system_device_info(). Splitting into per-area/per-keypad
      devices is tracked as follow-up work, not a rule failure - the rule
      requires entities belong to a device, not a specific device
      granularity.
  diagnostics: done
  discovery-update-info:
    status: done
    comment: async_update_entry_from_discovery updates a config entry's host if the panel's discovered IP changes.
  discovery:
    status: done
    comment: |
      DHCP plus helpers/elk/discovery.py's UDP broadcast/directed discovery
      (ported from the former elkm1-lib dependency, now owned directly - see
      docs/decisions.md 2026-09-05) cover network XEP interfaces. Serial
      remains an explicit SerialPortSelector path. Generic FTDI/PL2303/
      CP2102/CH340 matches were removed because they identify bridge chips,
      not ELK products.
  docs-data-update:
    status: done
    comment: README's Architecture section explains the push-first/poll-fallback data flow.
  docs-examples:
    status: done
    comment: docs/cross_integration.md's Better Thermostat section and the linked blueprints give concrete usage examples.
  docs-known-limitations:
    status: done
    comment: |
      docs/cross_integration.md's Alarmo and Better Thermostat sections
      explain the door/window device_class best-effort limitation in
      user-facing terms; PROJECT_MAP.md has the underlying protocol
      reasoning for contributors.
  docs-supported-devices:
    status: done
    comment: README states Elk-M1 Gold and M1EZ8 explicitly.
  docs-supported-functions:
    status: done
    comment: README's "What it creates" table lists every platform and what it covers.
  docs-troubleshooting:
    status: done
    comment: README's Troubleshooting section rewritten and verified against the current codebase (debug logging path, diagnostics download) rather than carried over unreviewed.
  docs-use-cases:
    status: done
    comment: docs/cross_integration.md covers the cross-integration use cases; README's "What it creates" and Services sections cover general usage.
  dynamic-devices:
    status: exempt
    comment: |
      The panel's hardware configuration (zone/output/task/etc. counts) is
      fixed at panel-programming time, not something devices can appear
      into after Home Assistant setup.
  entity-category: done
  entity-device-class:
    status: done
    comment: |
      Applied wherever the protocol actually signals a physical type
      (temperature, voltage, trouble/problem, etc.). Zone door/window/
      motion classification is best-effort by protocol necessity - see
      the comment above binary_sensor.py's _DEVICE_CLASS_MAP.
  entity-disabled-by-default:
    status: done
    comment: ElkTroubleBinarySensor (one per trouble condition) is disabled by default; enabling all 23 on every install by default would be noisy.
  entity-translations:
    status: done
    comment: |
      strings.json's new "entity" section covers every entity with a fixed,
      generic English name: the panel sensor, active-zones summary, per-area
      alarm partitions and area-openings sensors (both translated with an
      area_num placeholder set once at __init__), the arm-request proxy
      switch, and all 23 named trouble binary sensors (translation_key ==
      the existing helpers/troublestatus.py machine name). ElkZoneBypassSwitch
      and ElkThermostatEMHeat keep a live name property override instead,
      because their name embeds a panel-reported zone/thermostat name that
      can arrive after entity creation, and Entity.translation_placeholders
      is a @final cached_property (computed once, then frozen) - see
      docs/decisions.md 2026-09-05. Every other entity's name is itself
      panel-supplied data (a zone/output/thermostat/counter/light/task name),
      not generic UI text, so it correctly has no translation_key.
  exception-translations:
    status: done
    comment: |
      Every HomeAssistantError/ConfigEntryAuthFailed/ConfigEntryNotReady
      raised in coordinator.py, __init__.py, alarm_control_panel.py,
      switch.py, number.py, and services.py now passes
      translation_domain=DOMAIN and a translation_key, with
      translation_placeholders for the ones that embed a value; the English
      text lives in strings.json's new "exceptions" section (14 keys).
  icon-translations:
    status: done
    comment: |
      icons.json covers the three entities with a static, translation_key-
      backed icon (number.counter, sensor.active_zones,
      switch.arm_system_request). ElkZoneBypassSwitch keeps a literal
      _attr_icon (mdi:shield-off) since icon-translations keys by
      translation_key, which that entity intentionally does not set - see
      docs/decisions.md 2026-09-05.
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure (network) and async_step_reconfigure_serial, both via async_update_and_abort.
  repair-issues:
    status: done
    comment: |
      helpers/panel_settings.py's verify_panel_configuration() now raises a
      Repair issue (ir.async_create_issue, outdated_panel_broadcasts_<entry_id>)
      when a required Global Programming broadcast setting can't be
      confirmed - actionable (enable it on the panel) and user-visible in
      Settings > Repairs, not just the log. Deleted via ir.async_delete_issue
      once every category is confirmed.
  stale-devices:
    status: exempt
    comment: Single static panel device; there's no per-device removal case to handle.

  # Platinum
  async-dependency:
    status: done
    comment: |
      helpers/elk's message encode/decode and Elk/subsystem orchestration are
      owned directly by this repository (elkm1-lib removed 2026-09-05, see
      docs/decisions.md). Each entry binds a native asyncio transport
      supervisor to its own Connection instance; no process-global class
      monkeypatch is performed, and unload awaits all owned stream/reconnect
      cleanup.
  inject-websession:
    status: exempt
    comment: No HTTP requests - this integration only speaks the Elk-M1 ASCII protocol over serial/TCP.
  strict-typing:
    status: done
    comment: |
      CI runs strict mypy against the whole integration with zero errors.
      Targeted attr-defined suppressions document the small set of
      subclass-only ELK fields that helpers/elk's own collection classes
      expose as Element; strict checks remain enabled globally.
