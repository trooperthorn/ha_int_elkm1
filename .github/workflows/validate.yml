name: Validate Integration

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main ]

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # HACS reads license metadata from the repository's default branch,
          # not the checked-out feature branch. Validate it normally on main;
          # branch runs still validate the other repository and integration gates.
          ignore: ${{ github.ref != 'refs/heads/main' && 'license' || '' }}

