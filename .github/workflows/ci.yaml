name: CI Configuration

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify installed support matrix
        run: python -c "from importlib.metadata import version; import sys; assert version('homeassistant') == '2026.8.3'; assert sys.version_info[:2] == (3, 14)"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy --config-file mypy.ini custom_components/elkm1
