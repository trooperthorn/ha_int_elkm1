name: Test Suite

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ha-version: "2026.8.3", python-version: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt \
            -c "https://raw.githubusercontent.com/home-assistant/core/${{ matrix.ha-version }}/homeassistant/package_constraints.txt"

      - name: Verify installed support matrix
        run: python -c "from importlib.metadata import version; import sys; assert version('homeassistant') == '${{ matrix.ha-version }}'; assert sys.version_info[:2] == (3, 14)"
            
      - name: Run Pytest
        run: pytest -ra --strict-markers tests/
