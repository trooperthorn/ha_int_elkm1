# Runs lint, type check, and the pytest suite on every push and pull request.
# release.yml calls this workflow so the same jobs gate every GitHub Release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The harness pins the beta core it was cut from, so the stable core is
      # pinned in its own file and installed second; the assert proves it.
      - name: Install the test harness
        run: pip install -r requirements-dev.txt
      - name: Pin the stable core over the harness
        run: pip install -r requirements-core.txt
      - name: Verify runtime versions
        run: python -c "from importlib.metadata import version; import sys; print(version('homeassistant')); assert version('homeassistant') == '2026.9.0'; assert sys.version_info[:2] == (3, 14)"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --config-file mypy.ini custom_components/elkm1
      - name: Run the suite
        run: pytest -ra --strict-markers tests/
      - name: Validate the release version fields
        run: python3 scripts/build_release_artifacts.py --validate-only

  programmer:
    name: programmer (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-programmer.txt
      # The service has no Home Assistant dependency and its suite must not
      # load the harness plugin, so it gets its own environment and configs.
      - name: Install the service and its test tools
        run: |
          pip install -r requirements-programmer.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests_programmer
      - name: Type check
        run: mypy --config-file mypy-programmer.ini
      - name: Run the suite
        run: pytest -c pytest-programmer.ini -ra --strict-markers
