[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# The elk-programmer service (src/elk_programmer) is the installer programming
# tool that elk_programmer_app packages. The integration in custom_components
# is distributed by HACS and is not part of this package. See docs/programmer/.
[project]
name = "elk-programmer"
version = "2026.09.06.8"
description = "Installer programming application for Elk-M1 Gold panels, a replacement for ElkRP"
# The app container runs the Alpine base image's Python (3.12 on Alpine 3.23);
# CI proves the service on 3.12 and 3.14.
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.40",
  "serialx>=1.9.0",
  "httpx>=0.28",
  "websockets>=13",
]

[project.optional-dependencies]
mdb = ["pyodbc>=5.3"]
dev = ["pytest>=9", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
elk-programmer = "elk_programmer.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"elk_programmer.data" = ["*.csv"]
"elk_programmer.web.static" = ["*.html"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "ASYNC",   # flake8-async
    "RUF",     # ruff-native rules
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "PIE",     # flake8-pie
    "RET",     # flake8-return
]
ignore = [
    "E501",    # line length is a soft target, not a hard failure - long
               # entity descriptions/log strings are common in this domain
    "ASYNC109", # our `timeout: float` parameters are passed straight into
               # asyncio.wait_for()/asyncio.timeout() internally - the rule
               # wants call sites to wrap themselves instead, which would
               # just move the same parameter to every caller
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.elkm1", "elk_programmer"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RET504"]
"tests_programmer/*" = ["RET504"]
