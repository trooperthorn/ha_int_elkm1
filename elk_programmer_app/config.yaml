name: "Elk Programmer"
description: "Installer programming for Elk-M1 Gold panels, started on demand"
version: "2026.09.06.1"
slug: "elk_programmer"
url: "https://github.com/trooperthorn/ha_int_elkm1/"
init: false
startup: application

# Stopped by default and never auto-started; see docs/programmer/app.md.
boot: manual

arch:
  - aarch64
  - amd64

# Ingress is the only way in: no ports, no host network.
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-edit
panel_title: Elk Programmer
panel_admin: true

# The one API grant: calling the elkm1 integration's session claim services.
homeassistant_api: true
hassio_api: false
hassio_role: default

map: []

options:
  host: ""
  port: 2101
  allowed_users: []
  idle_minutes: 15
  read_only: true
schema:
  host: str
  port: port
  allowed_users:
    - str
  idle_minutes: int(1,120)
  read_only: bool

image: "ghcr.io/trooperthorn/elk-programmer"
