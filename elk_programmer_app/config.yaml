name: "Elk Programmer"
description: "Installer programming for Elk-M1 Gold panels, started on demand"
version: "2026.09.06.6"
slug: "elk_programmer"
url: "https://github.com/trooperthorn/ha_int_elkm1/"
init: false
startup: application

# Stopped by default and never auto-started; see docs/programmer/app.md.
boot: manual

arch:
  - aarch64
  - amd64

# Ingress is the only way in: no ports, no host network.
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-edit
panel_title: Elk Programmer
panel_admin: true

# The one API grant: disabling and re-enabling the elkm1 integration's entries
# around a session (a serial port is exclusive) and, later, the session claim.
homeassistant_api: true
hassio_api: false
hassio_role: default

# The panel is reached over RS-232 from this host; uart maps the serial
# devices into the container and the serial_port option picks one.
uart: true

map: []

# serial_port is mandatory (null default) so the device picker shows without
# revealing hidden options; host and port are optional and only for a network XEP.
options:
  connection: serial
  serial_port: null
  baud: 115200
  release_integration: true
  forward_audit: true
  allowed_users: []
  idle_minutes: 15
  read_only: true
schema:
  connection: list(serial|network)
  serial_port: device(subsystem=tty)
  baud: int(300,115200)
  host: str?
  port: port?
  release_integration: bool
  forward_audit: bool
  allowed_users:
    - str
  idle_minutes: int(1,120)
  read_only: bool

# No image key: the Supervisor builds the container on the host from the
# Dockerfile until a published image exists (docs/programmer/backlog.md).
